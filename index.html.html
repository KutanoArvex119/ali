const B=RAW.map(([id,name,rarity,role,range,speed,year,attack,sup,emoji,shape])=>({id,name,rarity,role,range,speed,year,attack,super:sup,emoji,shape}));const modes=[{id:'classic',name:'KLASİK MOD',icon:'🎯',desc:'Özellikleri karşılaştır, gizli karakteri bul.',color:'#2389FF'},{id:'emoji',name:'EMOJİ MODU',icon:'🧩',desc:'Emojilerin anlattığı Brawler kim?',color:'#9146FF'},{id:'silhouette',name:'SİLÜET MODU',icon:'👤',desc:'Gölgenin ardındaki karakteri keşfet.',color:'#FF4757'},{id:'ability',name:'YETENEK MODU',icon:'⚡',desc:'Saldırı ve süper yeteneklerden tahmin et.',color:'#35D878'}];const MAX=6;const key='bg-standalone-v1';let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}state=state||{games:{},history:[],unlocked:[],settings:{dark:true,sound:true}};let page='home',gameKey='',query='',filter='',rarity='',role='';const $=s=>document.querySelector(s),save=()=>localStorage.setItem(key,JSON.stringify(state));const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}const verified=B.filter(b=>b.emoji.length>=3&&b.year);const targetFor=(m,d)=>verified[hash('brawlguess-v1:'+d+':'+m)%verified.length];function avatar(b,big=false,shadow=false){return `<span class="avatar ${big?'big':''} ${shadow?'shadow':''}" style="${shadow?'filter:brightness(0)':''}">${['🤠','🐻','🔫','💪','🚀','🥊','🍾','🎸','🧨','🎯'][b.shape%10]}</span>`}function start(m,daily){const date=today(),k=daily?`daily:${date}:${m}`:`practice:${m}:${Date.now()}:${Math.random()}`;if(!state.games[k])state.games[k]={key:k,mode:m,daily,date,target:(daily?targetFor(m,date):verified[Math.floor(Math.random()*verified.length)]).id,guesses:[],done:false,won:false};gameKey=k;query='';save();go('game')}function go(p){page=p;render();window.scrollTo(0,0)}function current(){return state.games[gameKey]}function submit(id){const g=current();if(!g||g.done||g.guesses.includes(id))return;g.guesses.push(id);g.won=id===g.target;g.done=g.won||g.guesses.length===MAX;if(g.done){state.history.push({key:g.key,mode:g.mode,daily:g.daily,date:g.date,won:g.won,attempts:g.guesses.length,target:g.target});if(g.won&&!state.unlocked.includes(g.target))state.unlocked.push(g.target)}query='';save();render()}function compare(b,t){return [['Nadirlik',b.rarity,b.rarity===t.rarity?'right':'wrong'],['Sınıf',b.role,b.role===t.role?'right':'wrong'],['Menzil',b.range,b.range===t.range?'right':'wrong'],['Hız',b.speed,b.speed===t.speed?'right':'wrong'],['Çıkış',b.year+(b.year<t.year?' ↑':b.year>t.year?' ↓':''),b.year===t.year?'right':Math.abs(b.year-t.year)<=2?'partial':'wrong']]}function count(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Istanbul',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date()).split(':').map(Number);let s=86400-p[0]*3600-p[1]*60-p[2];return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}function rate(a){return a.length?Math.round(a.filter(x=>x.won).length/a.length*100):0}function shell(s){$('#root').innerHTML=s;document.body.classList.toggle('light',!state.settings.dark)}function home(){const wins=state.history.filter(x=>x.won).length;return `<div class="hero"><small>★ GÜNLÜK BRAWLER MÜCADELESİ ★</small><h1>BRAWLER'I TAHMİN ET!</h1><p>Dört farklı modda ipuçlarını çöz ve karakterleri keşfet!</p><button class="btn" onclick="start('classic',true)">⚡ GÜNLÜK OYNA</button><button class="btn blue" onclick="go('help')">NASIL OYNANIR?</button></div><div class="panel">🏆 Bugünün mücadelesi · <b id="timer">${count()}</b> sonra yenileniyor · ${modes.filter(m=>state.games[`daily:${today()}:${m.id}`]?.done).length}/4 tamamlandı</div><div class="panel">🏆 ${wins} galibiyet · 🎮 ${state.history.length} tamamlanan oyun</div>${modeCards()}`}function modeCards(){return `<h2>🎮 OYUN MODLARI</h2><div class="cards">${modes.map(m=>`<div class="card"><div class="emoji">${m.icon}</div><h2>${m.name}</h2><p>${m.desc}</p><button class="btn" onclick="start('${m.id}',true)">${state.games[`daily:${today()}:${m.id}`]?.done?'SONUCU GÖR':'GÜNLÜK OYNA'}</button><button class="btn blue" onclick="start('${m.id}',false)">PRATİK</button></div>`).join('')}</div>`}function game(){const g=current();if(!g)return home();const t=B.find(x=>x.id===g.target),m=modes.find(x=>x.id===g.mode);let clue='';if(g.mode==='emoji')clue=`<div class="panel"><h2>${t.emoji.slice(0,Math.min(5,3+g.guesses.length)).join('　')}</h2><p>Her yanlış tahminde yeni emoji açılır.</p></div>`;if(g.mode==='silhouette')clue=`<div class="panel" style="text-align:center">${avatar(t,true,!g.done)}<p>${g.guesses.length>=3?'Sınıf: '+t.role:'Gizli karakterin silüeti'} ${g.guesses.length>=4?' · '+t.rarity:''}</p><small class="muted">Temsili avatar silüeti</small></div>`;if(g.mode==='ability')clue=`<div class="panel"><h3>⚡ Bu yetenek kime ait?</h3><p>${t.attack}</p>${g.guesses.length>=2?`<p>🌟 Süper: ${t.super}</p>`:''}${g.guesses.length>=4?`<p>💡 ${t.role} · ${t.range}</p>`:''}</div>`;const rows=g.guesses.length?`<h2>Tahminler (${g.guesses.length})</h2>${g.mode==='classic'?`<div class="compare">${[...g.guesses].reverse().map(id=>{const b=B.find(x=>x.id===id);return `<div class="row"><span class="cell" style="background:#314570">${b.name}</span>${compare(b,t).map(c=>`<span class="cell ${c[2]}">${c[0]}<br><b>${c[1]}</b></span>`).join('')}</div>`}).join('')}</div>`:g.guesses.map(id=>`<span class="pill">${B.find(x=>x.id===id).name} ${id===g.target?'✓':'✕'}</span>`).join('')}`:'';const result=g.done?`<div class="result"><h1>${g.won?'🎉 KAZANDIN!':'💫 OYUN BİTTİ'}</h1>${avatar(t,true)}<h2>${t.name}</h2><p>${g.guesses.length}/${MAX} tahmin</p><button class="btn blue" onclick="share()">SONUCU PAYLAŞ</button>${!g.daily?`<button class="btn" onclick="start('${g.mode}',false)">YENİDEN OYNA</button>`:''}<button class="btn" onclick="go('modes')">MODLAR</button></div>`:'';return `<button class="small" onclick="go('modes')">← Modlara dön</button><h1>${m.icon} ${m.name}</h1><p>${g.daily?'📅 Günlük':'♾️ Pratik'} · ${g.guesses.length}/${MAX} tahmin</p>${clue}${!g.done?`<div class="panel"><label for="search">BRAWLER TAHMİNİ</label><input id="search" class="search" autocomplete="off" placeholder="Brawler adı yaz..." value="${query.replaceAll('"','&quot;')}" oninput="suggest(this.value)" onkeydown="keypick(event)"><div class="suggest" id="suggest"></div></div>`:''}${rows}${result}`}function suggest(v){query=v;const g=current(),items=B.filter(b=>!g.guesses.includes(b.id)&&b.name.toLocaleLowerCase('tr').includes(v.toLocaleLowerCase('tr'))).slice(0,8);$('#suggest').innerHTML=v.trim()?items.map(b=>`<button onclick="submit('${b.id}')">${avatar(b)} <span>${b.name}<br><small>${b.rarity} · ${b.role}</small></span></button>`).join('')||'<p>Karakter bulunamadı</p>':''}function keypick(e){if(e.key==='Enter'){const first=$('#suggest button');if(first)first.click()}}function share(){const g=current(),t=B.find(b=>b.id===g.target);const lines=g.guesses.map(id=>{const b=B.find(x=>x.id===id);return g.mode==='classic'?compare(b,t).map(c=>c[2]==='right'?'🟩':c[2]==='partial'?'🟨':'🟥').join(''):id===g.target?'🟩🟩🟩':'🟥🟥🟥'});const txt=`BRAWL GUESS ${g.date} ${g.mode}\n${g.won?g.guesses.length:'X'}/${MAX}\n${lines.join('\n')}`;if(navigator.clipboard&&location.protocol!=='file:')navigator.clipboard.writeText(txt).then(()=>alert('Kopyalandı')).catch(()=>prompt('Sonucu kopyala:',txt));else prompt('Sonucu kopyala:',txt)}function statistics(){const a=state.history,w=a.filter(x=>x.won);return `<h1>📊 İSTATİSTİKLER</h1><div class="stats">${[['Toplam oyun',a.length],['Galibiyet',w.length],['Kazanma oranı',rate(a)+'%'],['Ortalama tahmin',w.length?(w.reduce((s,x)=>s+x.attempts,0)/w.length).toFixed(1):'—']].map(x=>`<div class="card"><h2>${x[1]}</h2>${x[0]}</div>`).join('')}</div><h2>Mod istatistikleri</h2><div class="grid">${modes.map(m=>{let r=a.filter(x=>x.mode===m.id);return `<div class="card"><h3>${m.icon} ${m.name}</h3><p>${r.length} oyun · ${rate(r)}% başarı</p><p>Günlük: ${r.filter(x=>x.daily).length} · Pratik: ${r.filter(x=>!x.daily).length}</p></div>`}).join('')}</div><h2>Son oyunlar</h2>${a.length?[...a].reverse().slice(0,15).map(x=>`<div class="panel">${x.won?'🏆':'❌'} ${x.mode} · ${B.find(b=>b.id===x.target)?.name} · ${x.attempts}/6 · ${x.date}</div>`).join(''):'<p>Henüz tamamlanan oyun yok.</p>'}`}function collection(){const items=B.filter(b=>b.name.toLocaleLowerCase('tr').includes(filter.toLocaleLowerCase('tr'))&&(!rarity||b.rarity===rarity)&&(!role||b.role===role));return `<h1>🗂️ KOLEKSİYON</h1><p>${state.unlocked.length}/${B.length} karakter keşfedildi</p><div class="filters"><input placeholder="Karakter ara" value="${filter}" oninput="filter=this.value;render()"><select onchange="rarity=this.value;render()"><option value="">Tüm nadirlikler</option>${[...new Set(B.map(b=>b.rarity))].map(x=>`<option ${rarity===x?'selected':''}>${x}</option>`).join('')}</select><select onchange="role=this.value;render()"><option value="">Tüm sınıflar</option>${[...new Set(B.map(b=>b.role))].map(x=>`<option ${role===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid">${items.map(b=>`<button class="collection-card" onclick="detail('${b.id}')">${avatar(b)}<h3>${b.name} ${state.unlocked.includes(b.id)?'🏆':''}</h3><small>${b.rarity} · ${b.role}</small></button>`).join('')}</div>${items.length?'':'Eşleşen karakter bulunamadı.'}`}function detail(id){const b=B.find(x=>x.id===id);$('#root').innerHTML=`<main><button class="small" onclick="go('collection')">← Koleksiyona dön</button><div class="panel">${avatar(b,true)}<h1>${b.name}</h1><p>${b.rarity} · ${b.role} · ${b.range} · ${b.speed} · ${b.year}</p><h3>Normal saldırı</h3><p>${b.attack}</p><h3>Süper yetenek</h3><p>${b.super}</p><p>${b.emoji.join(' ')}</p></div></main>`}function settings(){return `<h1>⚙️ AYARLAR</h1><div class="panel"><h2>Görünüm</h2><button class="btn" onclick="state.settings.dark=!state.settings.dark;save();render()">${state.settings.dark?'☀️ Açık temaya geç':'🌙 Koyu temaya geç'}</button></div><div class="panel"><h2>Ses</h2><button class="btn blue" onclick="state.settings.sound=!state.settings.sound;save();render()">${state.settings.sound?'🔊 Ses açık':'🔇 Ses kapalı'}</button></div><div class="panel"><p>İlerleme bu tarayıcıda localStorage ile saklanır.</p></div>`}function help(){return `<h1>🎮 NASIL OYNANIR?</h1><div class="panel"><p>Her oyunda 6 tahmin hakkın var. Karakter adını yazıp önerilerden seç.</p><p>🎯 Klasik: Yeşil doğru, kırmızı yanlış, sarı yakın çıkış yılı.</p><p>🧩 Emoji: Yanlış tahminlerde yeni emojiler açılır.</p><p>👤 Silüet: Temsili karakter simgesinin gölgesini ve ipuçlarını kullan.</p><p>⚡ Yetenek: Saldırı açıklamasını incele.</p><p>Günlük görevler İstanbul saatiyle gece yarısı yenilenir; pratik sınırsızdır.</p></div>`}function render(){shell(`<header><b>★ BRAWL GUESS</b><nav>${[['home','Ana Sayfa'],['modes','Oyun Modları'],['stats','İstatistikler'],['collection','Koleksiyon'],['settings','Ayarlar']].map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</nav></header><main>${page==='home'?home():page==='modes'?modeCards():page==='game'?game():page==='stats'?statistics():page==='collection'?collection():page==='settings'?settings():help()}</main><div class="footer">Bağımsız hayran projesi. Supercell tarafından desteklenmez veya onaylanmaz. Temsili simgeler kullanılır.</div>`);if(page==='game'&&query&&$('#search'))suggest(query)}setInterval(()=>{const t=$('#timer');if(t)t.textContent=count();if(today()!==window._date){window._date=today();if(page==='home'||page==='modes')render()}},1000);window._date=today();render();</script></body></html>
